<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><div id="app"></div>
<script type="module">
import {createApp} from 'vue'
import {createRouter,createMemoryHistory} from 'vue-router'
import ElementPlus from 'element-plus'
import 'element-plus/dist/index.css'
import App from '../../src/App.vue'
import {authState} from '../../src/services/authSession'
import {openWorkOrderPopup} from '../../src/services/workOrderPopup'
authState.user={username:'me',name:'本人',role:'member'}
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/workspace/:menu',component:{render:()=>null}}]})
await router.push('/workspace/crm?section=industry')
createApp(App).use(router).use(ElementPlus).mount('#app')
window.testRouter=router
window.openTicket=openWorkOrderPopup
</script></html>
