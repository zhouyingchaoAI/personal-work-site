<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>2026 联指经营看板</title>
<style>
:root{
--primary:#2E1B93;--primary-deep:#1A0857;--primary-mid:#38139E;
--tint-bg:#ECE8FA;--tint-line:#E4E0F2;--page-bg:#FAFAFD;
--danger:#D5013C;--success:#04BC8A;--warning:#FB901C;--magenta:#9D1D7E;
--text:#2B2B3C;--text-sub:#6B6B80;--text-muted:#8A8AA0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e9f2;font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#nav{position:fixed;left:0;top:0;bottom:0;width:132px;background:var(--primary-deep);color:#fff;z-index:50;overflow:auto;padding:14px 0}
#nav h1{font-size:13px;font-weight:700;padding:0 14px 12px;color:#fff;opacity:.9;line-height:1.4}
#nav a{display:block;padding:9px 14px;font-size:12.5px;color:rgba(255,255,255,.7);text-decoration:none;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav a.on{background:var(--primary);color:#fff;border-left-color:var(--warning)}
#stage{margin-left:132px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:28px}
.page{width:1600px;height:1067px;background:var(--page-bg);position:relative;box-shadow:0 8px 40px -12px rgba(26,8,87,.4);overflow:hidden;flex:none}
.hdr{position:absolute;left:0;top:0;width:100%;background:linear-gradient(120deg,var(--primary) 0%,var(--primary-deep) 100%);color:#fff}
.hdr .no{position:absolute;left:48px;top:22px;width:48px;height:36px;background:rgba(255,255,255,.18);border-radius:6px;display:grid;place-items:center;font-size:16px;font-weight:700}
.hdr .t{position:absolute;left:112px;top:24px;font-size:28px;font-weight:700}
.hdr .s{position:absolute;left:112px;top:62px;font-size:13px;color:rgba(255,255,255,.6)}
.band{position:absolute;left:48px;width:1504px}
.foot{position:absolute;left:48px;right:48px;bottom:0;height:40px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-muted);border-top:1px solid var(--tint-line)}
.row{display:flex;gap:16px}
.kpis{position:absolute;left:48px;top:128px;width:1504px;height:128px;display:flex;gap:16px}
.card{flex:1;height:128px;background:#fff;border:1px solid var(--tint-line);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .lb{font-size:12px;color:var(--text-sub);display:flex;align-items:center;gap:6px}
.card .vv{font-size:32px;font-weight:700;line-height:1.05;margin-top:8px}
.card .sub{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.3}
.dot{width:8px;height:8px;border-radius:50%;position:absolute;right:14px;top:16px}
.g-green{background:var(--success)}.g-amber{background:var(--warning)}.g-red{background:var(--danger)}.g-gray{background:var(--text-muted)}
.box{background:#fff;border:1px solid var(--tint-line);border-radius:10px;padding:16px;height:100%;overflow:hidden}
.box h3{font-size:16px;font-weight:600;color:var(--primary-deep);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-sub);font-weight:400}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--tint-bg);color:var(--primary-deep);font-weight:600;height:30px;padding:0 8px;text-align:right}
th:first-child{text-align:left}
td{height:27px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--tint-line)}
td:first-child{text-align:left;color:var(--text)}
tr:nth-child(even) td{background:#FAFAFD}
tr.total td{font-weight:700;border-top:1.5px solid var(--primary)}
.neg{color:var(--danger)}.pos{color:var(--success)}
.pcard{background:#fff;border-radius:8px;border-left:3px solid var(--primary);padding:11px 12px;margin-bottom:9px}
.pcard .h{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .d{font-size:11px;color:var(--text-sub);margin-top:4px;line-height:1.5}
.pill{font-size:10px;padding:1px 8px;border-radius:10px;font-weight:600;flex:none}
.chk{font-size:12.5px;color:var(--text);line-height:1.7;padding:5px 0;display:flex;gap:7px}
.chk b{color:var(--success)}
.banner{background:rgba(213,1,60,.06);border:1px solid rgba(213,1,60,.25);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--danger);line-height:1.6;font-weight:500}
svg{display:block}
.flowbox{background:var(--tint-bg);border-radius:6px;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11.5px;margin-bottom:0}
.flowbox b{color:var(--primary-deep)}
.flowbox .m{color:var(--text-sub);font-size:11px}
.flowarrow{text-align:center;color:var(--text-muted);font-size:12px;line-height:12px}
.flowend{background:rgba(213,1,60,.08);border:1.5px solid var(--danger);color:var(--danger);font-weight:600}
body.embed{background:transparent}
body.embed #nav{display:none}
body.embed #stage{margin-left:0;padding:0;gap:0}
body.embed .page{box-shadow:none}
@media print{@page{size:1600px 1067px;margin:0}body{background:#fff}#nav{display:none}#stage{margin:0;padding:0;gap:0}.page{box-shadow:none;break-after:always}}
</style>
</head>
<body>
<nav id="nav"><h1>2026 联指<br/>经营看板</h1><div id="navlinks"></div></nav>
<div id="stage"></div>
<script>const DATA = __DASHBOARD_DATA__;</script>
<script>
const C={primary:'#2E1B93',deep:'#1A0857',mid:'#38139E',tintBg:'#ECE8FA',tintLine:'#E4E0F2',danger:'#D5013C',success:'#04BC8A',warning:'#FB901C',magenta:'#9D1D7E',text:'#2B2B3C',sub:'#6B6B80',muted:'#8A8AA0'};
const LIGHT={green:C.success,amber:C.warning,red:C.danger,gray:C.muted};
function fmt(v){if(v===null||v===undefined||v==='')return '—';const num=Number(v);if(!isFinite(num))return '—';return num.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmt0(v){if(v===null||v===undefined||v==='')return '—';return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0});}
function pct(v){if(v===null||v===undefined||v==='')return '—';return (Number(v)*100).toFixed(1)+'%';}
function signed(v){if(v===null||v===undefined||v==='')return '—';const s=fmt(v);return Number(v)<0?s:'+'+s;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const A=(x)=>Array.isArray(x)?x:[];
const findK=(arr,key,val)=>A(arr).find(r=>r[key]===val)||{};

// ---------- SVG chart primitives ----------
function axisY(x0,y0,h,max,ticks=5){let s='';for(let i=0;i<=ticks;i++){const y=y0+h-h*i/ticks;const v=max*i/ticks;s+=`<line x1="${x0}" y1="${y}" x2="${x0+9999}" y2="${y}" stroke="${C.tintLine}" stroke-width="1"/><text x="${x0-8}" y="${y+3}" font-size="10" fill="${C.muted}" text-anchor="end">${v>=1000?Math.round(v).toLocaleString():v.toFixed(0)}</text>`;}return s;}

function barChart({data,xKey,series,width,height,colors,valueLabels=[]}){
 const L=56,R=16,T=16,B=32;const pw=width-L-R,ph=height-T-B;
 let max=0;data.forEach(d=>series.forEach(s=>{max=Math.max(max,Number(d[s]||0))}));
 max=niceMax(max);
 let s=`<svg width="${width}" height="${height}">`;
 s+=`<g transform="translate(0,0)">`+axisY(L,T,ph,max).replace(/x2="\d+"/,`x2="${L+pw}"`)+`</g>`;
 const groups=data.length;const gw=pw/groups;const bw=Math.min(18,(gw-8)/series.length);
 data.forEach((d,gi)=>{
  const gx=L+gi*gw+(gw-bw*series.length-4*(series.length-1))/2;
  series.forEach((se,si)=>{
   const v=Number(d[se]||0);const bh=max?v/max*ph:0;const x=gx+si*(bw+4);const y=T+ph-bh;
   s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${colors[si]}"/>`;
   if(valueLabels.includes(se)&&v)s+=`<text x="${x+bw/2}" y="${y-4}" font-size="10" fill="${C.sub}" text-anchor="middle">${fmt(v)}</text>`;
  });
  s+=`<text x="${L+gi*gw+gw/2}" y="${T+ph+18}" font-size="11" fill="${C.muted}" text-anchor="middle">${esc(d[xKey])}</text>`;
 });
 s+=`</svg>`;return s;
}
function niceMax(m){if(m<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const step=n<=1?1:n<=2?2:n<=5?5:10;return step*p;}

function hBarChart({data,yKey,series,width,height,colors,xMax,rightLabels}){
 const L=120,R=90,T=8,B=8;const pw=width-L-R;const rowH=(height-T-B)/data.length;const bh=Math.min(14,rowH/(series.length+0.6));
 let max=xMax||0;if(!max)data.forEach(d=>series.forEach(se=>max=Math.max(max,Number(d[se]||0))));max=niceMax(max);
 let s=`<svg width="${width}" height="${height}">`;
 data.forEach((d,i)=>{
  const cy=T+i*rowH+rowH/2;
  s+=`<text x="${L-8}" y="${cy+4}" font-size="11" fill="${C.text}" text-anchor="end">${esc(d[yKey])}</text>`;
  series.forEach((se,si)=>{
   const v=Number(d[se]||0);const w=max?Math.abs(v)/max*pw:0;const y=cy-(series.length*bh)/2+si*bh;
   s+=`<rect x="${L}" y="${y}" width="${w}" height="${bh-2}" fill="${colors[si]}" rx="2"/>`;
  });
  if(rightLabels&&rightLabels[i]!=null)s+=`<text x="${L+pw+8}" y="${cy+4}" font-size="11" font-weight="600" fill="${rightLabels[i].color||C.sub}" text-anchor="start">${rightLabels[i].text}</text>`;
 });
 s+=`</svg>`;return s;
}

function waterfall({steps,width,height}){
 const L=16,R=16,T=24,B=40;const pw=width-L-R,ph=height-T-B;
 let vals=steps.map(s=>Number(s.值||0));
 let cum=0,points=[],minC=0,maxC=0;
 steps.forEach((st,i)=>{
  if(st.类型==='start'||st.类型==='end'){points.push({base:0,top:vals[i],val:vals[i],st});cum=vals[i];}
  else{const b=cum;cum+=vals[i];points.push({base:Math.min(b,cum),top:Math.max(b,cum),val:vals[i],st});}
  minC=Math.min(minC,cum,0);maxC=Math.max(maxC,cum,vals[i]);
 });
 const range=maxC-minC||1;const y0=T+ph-(0-minC)/range*ph;
 const n=steps.length;const bw=Math.min(64,(pw-(n-1)*20)/n);const gap=(pw-bw*n)/(n-1);
 const Y=v=>T+ph-(v-minC)/range*ph;
 let s=`<svg width="${width}" height="${height}">`;
 s+=`<rect x="${L}" y="${y0}" width="${pw}" height="${T+ph-y0}" fill="rgba(213,1,60,0.03)"/>`;
 s+=`<line x1="${L}" y1="${y0}" x2="${L+pw}" y2="${y0}" stroke="${C.sub}" stroke-width="1.5"/>`;
 points.forEach((p,i)=>{
  const x=L+i*(bw+gap);const yt=Y(p.top),yb=Y(p.base);const h=Math.max(2,yb-yt);
  const col=p.st.类型==='end'?C.danger:p.st.类型==='start'?C.primary:(p.val>=0?C.success:C.danger);
  s+=`<rect x="${x}" y="${yt}" width="${bw}" height="${h}" fill="${col}"/>`;
  const label=(p.val>=0?'+':'')+fmt(p.val);
  s+=`<text x="${x+bw/2}" y="${yt-5}" font-size="11" font-weight="600" fill="${C.text}" text-anchor="middle">${p.st.类型==='start'||p.st.类型==='end'?fmt(p.val):label}</text>`;
  s+=`<text x="${x+bw/2}" y="${T+ph+16}" font-size="10.5" fill="${C.muted}" text-anchor="middle">${esc(p.st.科目)}</text>`;
  if(i<points.length-1){const nx=L+(i+1)*(bw+gap);const yl=Y(points[i+1].st.类型==='end'||points[i+1].st.类型==='start'?points[i+1].top:(points[i+1].val>=0?points[i+1].base:points[i+1].top));s+=`<line x1="${x+bw}" y1="${Y(p.st.类型==='minus'?p.base:p.top)}" x2="${nx}" y2="${Y(p.st.类型==='minus'?p.base:p.top)}" stroke="${C.muted}" stroke-width="1" stroke-dasharray="3 3"/>`;}
 });
 s+=`</svg>`;return s;
}

function donut({slices,width,height,centerTitle,centerValue}){
 const cx=width*0.36,cy=height/2,rO=Math.min(width*0.32,height/2-8),rI=rO*0.6;
 const total=slices.reduce((a,b)=>a+Number(b.value||0),0)||1;let ang=-Math.PI/2;
 let s=`<svg width="${width}" height="${height}">`;
 slices.forEach(sl=>{const frac=Number(sl.value||0)/total;const a2=ang+frac*Math.PI*2;
  const x1=cx+rO*Math.cos(ang),y1=cy+rO*Math.sin(ang),x2=cx+rO*Math.cos(a2),y2=cy+rO*Math.sin(a2);
  const xi1=cx+rI*Math.cos(a2),yi1=cy+rI*Math.sin(a2),xi2=cx+rI*Math.cos(ang),yi2=cy+rI*Math.sin(ang);
  const large=frac>0.5?1:0;
  s+=`<path d="M${x1},${y1} A${rO},${rO} 0 ${large} 1 ${x2},${y2} L${xi1},${yi1} A${rI},${rI} 0 ${large} 0 ${xi2},${yi2} Z" fill="${sl.color}"/>`;ang=a2;});
 s+=`<text x="${cx}" y="${cy-2}" font-size="24" font-weight="700" fill="${C.text}" text-anchor="middle">${centerValue}</text>`;
 s+=`<text x="${cx}" y="${cy+18}" font-size="11" fill="${C.muted}" text-anchor="middle">${centerTitle}</text>`;
 let ly=cy-slices.length*11+8;const lx=width*0.66;
 slices.forEach(sl=>{const p=(Number(sl.value||0)/total*100).toFixed(1);s+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" rx="2" fill="${sl.color}"/><text x="${lx+16}" y="${ly}" font-size="11.5" fill="${C.text}">${esc(sl.label)}</text><text x="${width-4}" y="${ly}" font-size="11.5" fill="${C.sub}" text-anchor="end">${fmt(sl.value)} · ${p}%</text>`;ly+=22;});
 s+=`</svg>`;return s;
}

function lineChart({data,xKey,series,width,height,highlightLast}){
 const L=48,R=16,T=16,B=30;const pw=width-L-R,ph=height-T-B;const max=1;
 let s=`<svg width="${width}" height="${height}">`;
 for(let i=0;i<=5;i++){const y=T+ph-ph*i/5;s+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${C.tintLine}"/><text x="${L-6}" y="${y+3}" font-size="10" fill="${C.muted}" text-anchor="end">${i*20}%</text>`;}
 const X=i=>L+(data.length===1?pw/2:pw*i/(data.length-1));const Y=v=>T+ph-Math.min(v,max)/max*ph;
 data.forEach((d,i)=>s+=`<text x="${X(i)}" y="${T+ph+18}" font-size="11" fill="${C.muted}" text-anchor="middle">${esc(d[xKey])}</text>`);
 series.forEach(se=>{let path='';data.forEach((d,i)=>{path+=(i?'L':'M')+X(i)+','+Y(Number(d[se.key]||0));});
  s+=`<path d="${path}" fill="none" stroke="${se.color}" stroke-width="${se.width||2}"/>`;
  data.forEach((d,i)=>{const v=Number(d[se.key]||0);const last=i===data.length-1;
   if(se.highlight&&last)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="10" fill="${se.color}" opacity="0.15"/>`;
   s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${se.width>2?5:4}" fill="${se.color}"/>`;
   s+=`<text x="${X(i)}" y="${Y(v)-9}" font-size="11" font-weight="${se.highlight&&last?700:400}" fill="${se.highlight&&last?C.danger:C.sub}" text-anchor="middle">${pct(v)}</text>`;});
 });
 s+=`</svg>`;return s;
}

function comboChart({data,xKey,bars,line,width,height,refLine}){
 const L=52,R=52,T=18,B=32;const pw=width-L-R,ph=height-T-B;
 let bmax=0;data.forEach(d=>bars.forEach(b=>bmax=Math.max(bmax,Number(d[b.key]||0))));bmax=niceMax(bmax);
 let lmax=refLine?Math.max(refLine.value,...data.map(d=>Number(d[line.key]||0))):Math.max(...data.map(d=>Number(d[line.key]||0)));lmax=niceMax(lmax);
 let s=`<svg width="${width}" height="${height}">`;
 for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${C.tintLine}"/><text x="${L-6}" y="${y+3}" font-size="9.5" fill="${C.muted}" text-anchor="end">${Math.round(bmax*i/4).toLocaleString()}</text>`;}
 const gw=pw/data.length;const bw=Math.min(16,(gw-10)/bars.length);
 const Y=v=>T+ph-v/bmax*ph;const YL=v=>T+ph-v/lmax*ph;
 data.forEach((d,gi)=>{const gx=L+gi*gw+(gw-bw*bars.length-4)/2;
  bars.forEach((b,bi)=>{const v=Number(d[b.key]||0);const h=v/bmax*ph;const x=gx+bi*(bw+4);
   const hl=d.__hl&&bi===0;s+=`<rect x="${x}" y="${Y(v)}" width="${bw}" height="${h}" fill="${b.color}" ${hl?`stroke="${C.danger}" stroke-width="2"`:''}/>`;});
  s+=`<text x="${L+gi*gw+gw/2}" y="${T+ph+18}" font-size="10.5" fill="${C.muted}" text-anchor="middle">${esc(d[xKey])}</text>`;});
 if(refLine){const y=YL(refLine.value);s+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${C.danger}" stroke-width="1" stroke-dasharray="5 4"/><text x="${L+pw}" y="${y-4}" font-size="10" fill="${C.danger}" text-anchor="end">${refLine.label}</text>`;}
 let path='';data.forEach((d,i)=>{path+=(i?'L':'M')+(L+i*gw+gw/2)+','+YL(Number(d[line.key]||0));});
 s+=`<path d="${path}" fill="none" stroke="${line.color}" stroke-width="2"/>`;
 data.forEach((d,i)=>{const v=Number(d[line.key]||0);s+=`<circle cx="${L+i*gw+gw/2}" cy="${YL(v)}" r="4" fill="${line.color}"/><text x="${L+i*gw+gw/2}" y="${YL(v)-8}" font-size="10" fill="${line.color}" text-anchor="middle">${v.toFixed(2)}</text>`;});
 s+=`</svg>`;return s;
}

function bubbleChart({points,width,height,refLineY}){
 const L=56,R=16,T=16,B=34;const pw=width-L-R,ph=height-T-B;
 const xmax=niceMax(Math.max(...points.map(p=>p.x)));const ymax=0.30;
 let s=`<svg width="${width}" height="${height}">`;
 for(let i=0;i<=5;i++){const y=T+ph-ph*i/5;s+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${C.tintLine}"/><text x="${L-6}" y="${y+3}" font-size="9.5" fill="${C.muted}" text-anchor="end">${(ymax*i/5*100).toFixed(0)}%</text>`;}
 for(let i=0;i<=4;i++){const x=L+pw*i/4;s+=`<text x="${x}" y="${T+ph+18}" font-size="9.5" fill="${C.muted}" text-anchor="middle">${Math.round(xmax*i/4).toLocaleString()}</text>`;}
 if(refLineY!=null){const y=T+ph-Math.min(refLineY,ymax)/ymax*ph;s+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${C.danger}" stroke-width="1" stroke-dasharray="5 4"/><text x="${L+pw}" y="${y-4}" font-size="10" fill="${C.danger}" text-anchor="end">目标 ${pct(refLineY)}</text>`;}
 points.forEach(p=>{const x=L+Math.min(p.x,xmax)/xmax*pw;const y=T+ph-Math.min(p.y,ymax)/ymax*ph;const r=Math.max(6,Math.min(30,Math.sqrt(Math.abs(p.r))*1.6));const col=p.pos?C.success:C.danger;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" fill-opacity="0.55" stroke="${col}" stroke-width="1"/>`;
  if(p.label)s+=`<text x="${x}" y="${y-r-3}" font-size="10.5" fill="${C.text}" text-anchor="middle">${esc(p.label)}</text>`;});
 s+=`</svg>`;return s;
}

function funnel({stages,width,height}){
 const T=8,gap=8;const h=(height-T-gap*(stages.length-1))/stages.length;const cx=width/2;
 const maxv=Math.max(...stages.map(s=>Math.max(1,s.count)));
 let s=`<svg width="${width}" height="${height}">`;let y=T;
 const wid=i=>Math.max(80,width*0.9*(0.45+0.55*(stages.length-i)/stages.length));
 stages.forEach((st,i)=>{const wTop=wid(i),wBot=wid(i+1);
  s+=`<polygon points="${cx-wTop/2},${y} ${cx+wTop/2},${y} ${cx+wBot/2},${y+h} ${cx-wBot/2},${y+h}" fill="${st.color}"/>`;
  s+=`<text x="${cx}" y="${y+h/2-2}" font-size="12" font-weight="600" fill="${st.textDark?C.text:'#fff'}" text-anchor="middle">${esc(st.label)} · ${st.count} 个</text>`;
  s+=`<text x="${cx}" y="${y+h/2+14}" font-size="10.5" fill="${st.textDark?C.sub:'rgba(255,255,255,.85)'}" text-anchor="middle">${st.amount}</text>`;
  y+=h+gap;});
 s+=`</svg>`;return s;
}

function stackedFlow({rows,width,height}){
 const L=110,R=150,T=8;const pw=width-L-R;const rowH=(height-T)/rows.length;const bh=Math.min(26,rowH*0.62);
 const max=Math.max(...rows.map(r=>Number(r.total||0)))||1;
 let s=`<svg width="${width}" height="${height}"><defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${C.tintBg}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${C.tintLine}" stroke-width="3"/></pattern></defs>`;
 rows.forEach((r,i)=>{const cy=T+i*rowH+rowH/2;const total=Number(r.total||0);const keep=Number(r.keep||0);
  const wTot=total/max*pw;const wKeep=total?keep/total*wTot:0;
  const isTot=r.isTotal;
  s+=`<text x="${L-8}" y="${cy+4}" font-size="12" ${isTot?'font-weight="700"':''} fill="${C.text}" text-anchor="end">${esc(r.name)}</text>`;
  s+=`<rect x="${L}" y="${cy-bh/2}" width="${wKeep}" height="${bh}" fill="${C.primary}"/>`;
  s+=`<rect x="${L+wKeep}" y="${cy-bh/2}" width="${wTot-wKeep}" height="${bh}" fill="url(#hatch)"/>`;
  const loss=total?((total-keep)/total*100).toFixed(1):'0';
  s+=`<text x="${L+wTot+8}" y="${cy+4}" font-size="11.5" font-weight="600" fill="${C.danger}" text-anchor="start">流失 ${loss}% · 留 ${fmt(keep)}</text>`;
  if(isTot)s+=`<line x1="${L}" y1="${cy-rowH/2}" x2="${L+pw}" y2="${cy-rowH/2}" stroke="${C.primary}" stroke-width="1"/>`;
 });
 s+=`</svg>`;return s;
}

// ---------- shared building blocks ----------
function kpi(label,val,sub,color,light,valColor){
 return `<div class="card"><div class="bar" style="background:${color}"></div>${light?`<span class="dot g-${light}"></span>`:''}<div class="lb">${label}</div><div class="vv" style="color:${valColor||C.text}">${val}</div><div class="sub">${sub||''}</div></div>`;
}
function progress(rate,light){const p=Math.min(1,Math.max(0,Number(rate||0)))*100;return `<div style="height:8px;background:${C.tintLine};border-radius:4px;position:relative;overflow:hidden;margin:6px 0"><div style="height:100%;width:${p}%;background:${LIGHT[light]||C.primary};border-radius:4px"></div></div>`;}
function pcard(no,title,pill,pillColor,desc,barColor){return `<div class="pcard" style="border-left-color:${barColor}"><div class="h"><span>${no?no+'  ':''}${title}</span>${pill?`<span class="pill" style="color:${pillColor};background:${pillColor}1f">${pill}</span>`:''}</div><div class="d">${desc}</div></div>`;}
function shell(no,title,sub,bigHeader){
 const hh=bigHeader?208:104;
 return {open:`<div class="page" id="p${no}"><div class="hdr" style="height:${hh}px"><div class="no">${no}</div><div class="t" style="${bigHeader?'font-size:44px;top:70px':''}">${title}</div><div class="s" style="${bigHeader?'top:132px;font-size:15px':''}">${sub}</div></div>`,
  foot:`<div class="foot"><span>数据口径：联指（不含其他）· 截至 2026 年 8 月 / Q3 累计 · 单位：万元</span><span>${no} / 10</span></div></div>`,hh};
}
function band(top,h,inner,cls=''){return `<div class="band ${cls}" style="top:${top}px;height:${h}px">${inner}</div>`;}

 }catch(e){html=`<div style="padding:40px">渲染失败：${esc(e.message)}</div>`;}
 stage.innerHTML=html;
 [...nav.children].forEach(a=>{a.classList.toggle('on',only?(+a.dataset.i===only):false);});
}
render();
</script>
</body>
</html>
