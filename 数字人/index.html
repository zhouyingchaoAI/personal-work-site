    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        const MODEL_URL = "./exports/chengxi_runtime.glb?v=20260602_extra_actions_pose3";
        // 页面可能部署在 /digital-human/ 或 /personal-office-assistant/digital-human/ 下，
        // 接口统一相对页面所在前缀访问，复用主站登录态。
        const API_BASE = location.pathname.replace(/\/digital-human\/?($|[^/]*$)/, "");
        const DEMO_SPEECH_TEXT = "大家好，我是犇犇，承希AI智能助手 ";
        const ACTION_CLIPS = {
            greet: "greet",
            welcome: "welcome",
            goodbye: "goodbye",
            thanks: "thanks",
            ok: "ok",
            cheer: "cheer",
            goal: "goal",
            laugh: "laugh",
            kiss: "kiss",
            awesome: "awesome"
        };
        const ACTION_SPEECH = {
            greet: DEMO_SPEECH_TEXT,
            welcome: "欢迎你，我是犇犇，承希AI智能助手",
            goodbye: "再见，期待下次见。",
            thanks: "谢谢你，我会继续努力。",
            ok: "好的，我已经确认。",
            cheer: "加油，我们一起完成。",
            goal: "我们先完成一个小目标。",
            laugh: "哈哈哈，这个太有意思了。",
            kiss: "么么哒，给你一点鼓励。",
            awesome: "牛掰，这个表现很棒。"
        };
        const BLINK_MORPHS = ["Blink_L", "Blink_R"];
        const MOUTH_MORPHS = ["Mouth_A", "Mouth_O", "Mouth_E", "Mouth_U", "Mouth_Close"];
        const CONTROLLED_MORPHS = [...BLINK_MORPHS, ...MOUTH_MORPHS];
        const EXPORTED_MORPH_ORDER = ["Blink_L", "Blink_R", "Mouth_Close", "Mouth_A", "Mouth_O", "Mouth_E", "Mouth_U"];
        const ENABLED_ACTIONS = new Set(["blink", "talk", ...Object.keys(ACTION_CLIPS)]);
        const BLINK_INTERVAL_MIN_MS = 2600;
        const BLINK_INTERVAL_RANGE_MS = 2400;

        const IS_EMBEDDED = window.self !== window.top;
        if (IS_EMBEDDED) {
            document.body.classList.add("embedded");
        }

        // 对话框显示/隐藏（纯桌宠形态），偏好落地并同步父页面收窄悬浮区。
        const CHAT_HIDDEN_KEY = "chengxi-chat-hidden";
        const chatToggleBtn = document.getElementById("chatToggleBtn");

        function setChatHidden(hidden, persist = true) {
            document.body.classList.toggle("chat-hidden", hidden);
            const label = hidden ? "显示对话框" : "隐藏对话框";
            chatToggleBtn.title = label;
            chatToggleBtn.setAttribute("aria-label", label);
            if (persist) {
                try {
                    localStorage.setItem(CHAT_HIDDEN_KEY, hidden ? "1" : "0");
                } catch {
                    // 存储不可用时偏好仅当次生效。
                }
            }
            if (IS_EMBEDDED) {
                window.parent.postMessage({ type: "chengxi.layout", chatHidden: hidden }, "*");
            }
        }

        chatToggleBtn.addEventListener("click", () => {
            setChatHidden(!document.body.classList.contains("chat-hidden"));
        });

        if (IS_EMBEDDED) {
            setChatHidden(false, false);
        }

        const viewer = document.getElementById("viewer");
        const canvas = document.getElementById("avatarCanvas");
        const viewerLoading = document.getElementById("viewerLoading");
        const chatLog = document.getElementById("chatLog");
        const chatPanel = document.getElementById("chatPanel");
        // 有消息后退出居中欢迎态，切换为常规对话列表布局。
        function markConversationStarted() {
            if (chatPanel) chatPanel.classList.remove("chat-empty");
        }
        // 状态同时写到顶栏和面板里（嵌入模式顶栏是隐藏的）。
        const statusNodes = [document.getElementById("statusText"), document.getElementById("panelStatus")].filter(Boolean);
        const statusText = {
            set textContent(value) {
                statusNodes.forEach(node => {
                    node.textContent = value;
                });
            },
            get textContent() {
                return statusNodes[0] ? statusNodes[0].textContent : "";
            }
        };
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const micBtn = document.getElementById("micBtn");
        const voiceBtn = document.getElementById("voiceBtn");
        const fileBtn = document.getElementById("fileBtn");
        const fileInput = document.getElementById("fileInput");
        const fileChips = document.getElementById("fileChips");
        const avatarBtn = document.getElementById("avatarBtn");
        let attachedFiles = [];
        let pendingWeeklyDraft = null;
        const actionButtons = document.querySelectorAll(".action-btn");

        const scene = new THREE.Scene();
        const clock = new THREE.Clock();
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
        // 嵌入模式的人物列较窄，相机拉远一点防止大动作出画。
        camera.position.set(0.12, 1.34, document.body.classList.contains("embedded") ? 7.6 : 6.85);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 5.0;
        controls.maxDistance = 9.2;
        controls.target.set(0, 1.05, 0);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x253142, 2.4));
        const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
        keyLight.position.set(3.2, 5.4, 4.2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        scene.add(keyLight);

        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(1.4, 64),
            new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.24 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.02;
        floor.receiveShadow = true;
        scene.add(floor);

        let avatar = null;
        let mixer = null;
        let idleAction = null;
        let currentAction = null;
        let speakingAction = null;
        let voiceEnabled = false;
        let avatarLoaded = false;
        let recognizer = null;
        let micActive = false;
        let micPausedForReply = false;
        let listening = false;
        let speakingUntil = 0;
        let nextMouthAt = 0;
        let mouthStepIndex = 0;
        let mouthSequence = [];
        let speechText = "";
        let speechRunId = 0;
        let activeAudio = null;
        let audioContext = null;
        let activeSource = null;
        let pendingSpeech = null;
        let blinkStartAt = 0;
        let blinkHoldMs = 110;
        let blinkManual = false;
        let nextBlinkAt = 0;
        const morphMeshes = new Map();
        const morphValues = new Map();
        const morphTargets = new Map();
        const clips = new Map();
        const chatHistory = [];

        function setControlsEnabled(enabled) {
            actionButtons.forEach(button => {
                button.disabled = !enabled || (!button.classList.contains("quick-prompt") && (!avatarLoaded || !ENABLED_ACTIONS.has(button.dataset.action)));
            });
            sendBtn.disabled = !enabled;
            // 允许在回答过程中先上传下一轮资料；上传独立处理自己的忙碌态。
            fileBtn.disabled = false;
        }

        let fittedSize = null;
        let lastFramedAspect = 0;

        // 嵌入模式视口窄长，按宽高比反推相机距离，保证牛角和耳朵完整入画。
        function updateCameraFraming() {
            if (!IS_EMBEDDED || !fittedSize) {
                return;
            }
            const halfFov = THREE.MathUtils.degToRad(camera.fov) / 2;
            const halfHeight = (fittedSize.y / 2) * 1.08;
            const halfWidth = (fittedSize.x / 2) * 1.18;
            const distanceForHeight = halfHeight / Math.tan(halfFov);
            const distanceForWidth = halfWidth / (Math.tan(halfFov) * Math.max(camera.aspect, 0.01));
            const distance = Math.min(16, Math.max(distanceForHeight, distanceForWidth) + 0.4);
            controls.maxDistance = Math.max(9.2, distance + 1);
            camera.position.set(0.12, camera.position.y, distance);
        }

        function resizeRenderer() {
            const { width, height } = viewer.getBoundingClientRect();
            renderer.setSize(width, height, false);
            camera.aspect = width / Math.max(1, height);
            camera.updateProjectionMatrix();
            if (Math.abs(camera.aspect - lastFramedAspect) > 0.001) {
                lastFramedAspect = camera.aspect;
                updateCameraFraming();
            }
        }

        function collectMorphTargets(root) {
            root.traverse(node => {
                if (!node.isMesh && !node.isSkinnedMesh) {
                    return;
                }
                node.castShadow = true;
                node.frustumCulled = false;
                if (node.name.toLowerCase().includes("tongue")) {
                    node.visible = false;
                    return;
                }
                const targetCount = node.morphTargetInfluences?.length ?? node.geometry?.morphAttributes?.position?.length ?? 0;
                if (!targetCount) {
                    return;
                }
                if (!node.morphTargetInfluences) {
                    node.morphTargetInfluences = new Array(targetCount).fill(0);
                }
                const entries = Object.entries(node.morphTargetDictionary || {});
                // Blender 导出的 GLB 保留了 targetNames 顺序，Three.js 旧版本可能不会还原 dictionary。
                const morphEntries = entries.length ? entries : EXPORTED_MORPH_ORDER.slice(0, targetCount).map((name, index) => [name, index]);
                morphEntries.forEach(([name, index]) => {
                    if (!morphMeshes.has(name)) {
                        morphMeshes.set(name, []);
                    }
                    morphMeshes.get(name).push({ mesh: node, index });
                });
            });
            CONTROLLED_MORPHS.forEach(name => {
                morphValues.set(name, 0);
                morphTargets.set(name, 0);
            });
        }

        function setMorphValue(name, value) {
            const targets = morphMeshes.get(name);
            if (!targets) {
                return;
            }
            targets.forEach(({ mesh, index }) => {
                mesh.morphTargetInfluences[index] = value;
            });
        }

        function targetMorph(name, value) {
            morphTargets.set(name, value);
        }

        // 说话中只调整目标值，避免口型在相邻音节之间硬切回闭合状态。
        function resetMouthTargets() {
            MOUTH_MORPHS.forEach(name => targetMorph(name, 0));
        }

        function closeMouthNow() {
            MOUTH_MORPHS.forEach(name => {
                morphTargets.set(name, 0);
                morphValues.set(name, 0);
                setMorphValue(name, 0);
            });
        }

        function targetBlink(value) {
            BLINK_MORPHS.forEach(name => targetMorph(name, value));
        }

        function resetFaceTargets() {
            closeMouthNow();
            targetBlink(0);
        }

        function updateMorphs(delta) {
            CONTROLLED_MORPHS.forEach(name => {
                const current = morphValues.get(name) ?? 0;
                const target = morphTargets.get(name) ?? 0;
                const value = THREE.MathUtils.damp(current, target, 18, delta);
                morphValues.set(name, value);
                setMorphValue(name, value);
            });
        }

        function fitAvatar(root) {
            scene.add(root);
            root.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(root);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const scale = 2.15 / Math.max(size.y, 0.1);
            root.scale.multiplyScalar(scale);
            root.position.sub(center.multiplyScalar(scale));
            root.updateMatrixWorld(true);
            const fittedBox = new THREE.Box3().setFromObject(root);
            // 根据导出模型包围盒落地，避免不同动作资产造成画面裁切。
            root.position.y -= fittedBox.min.y;
            controls.target.set(0, 1.05, 0);
            fittedSize = fittedBox.getSize(new THREE.Vector3());
            floor.scale.setScalar(Math.max(1.1, fittedSize.x * 0.44));
            updateCameraFraming();
        }

        function playIdle(transitionFrom = null, immediate = false) {
            if (!mixer) {
                return;
            }
            const previousAction = transitionFrom || (speakingAction && speakingAction.isRunning() ? speakingAction : null);
            currentAction = null;
            idleAction = clips.has("idle") ? mixer.clipAction(clips.get("idle")) : null;
            if (idleAction) {
                idleAction.reset().setLoop(THREE.LoopRepeat).setEffectiveWeight(1).setEffectiveTimeScale(1).play();
                if (previousAction && previousAction !== idleAction) {
                    previousAction.crossFadeTo(idleAction, 0.18, false);
                } else if (!immediate) {
                    idleAction.fadeIn(0.2);
                }
            }
            speakingAction = null;
            setControlsEnabled(true);
            statusText.textContent = speakingUntil ? "回答中" : "待机中";
            if (immediate) {
                mixer.update(0);
            }
        }

        // 自动播放策略（尤其 Safari/移动端）要求音频在用户手势内启动；
        // 用首次手势解锁的 AudioContext 播放 TTS，之后任意时刻都能出声。
        function ensureAudioContext() {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) {
                return null;
            }
            if (!audioContext) {
                audioContext = new Ctx();
            }
            if (audioContext.state === "suspended") {
                audioContext.resume().catch(() => {});
            }
            return audioContext;
        }

        // 语音链路日志：用户侧 F12 可见，定位"没有声音"具体卡在哪一级。
        function audioLog(stage, detail = "") {
            console.warn("[犇犇语音]", stage, detail);
        }

        // Safari 旧版不支持 fetch data: URI，统一用 atob 直接解出音频字节。
        function audioUriToBytes(audioUri) {
            const comma = audioUri.indexOf(",");
            const payload = comma >= 0 ? audioUri.slice(comma + 1) : audioUri;
            const binary = atob(payload);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        // 老版本 Safari 的 decodeAudioData 只支持回调形式，统一包成 Promise。
        function decodeAudio(context, raw) {
            return new Promise((resolve, reject) => {
                const result = context.decodeAudioData(raw, resolve, reject);
                if (result && typeof result.then === "function") {
                    result.then(resolve, reject);
                }
            });
        }

        function flushPendingSpeech() {
            const context = ensureAudioContext();
            if (!context || !pendingSpeech) {
                return;
            }
            const pending = pendingSpeech;
            pendingSpeech = null;
            if (pending.runId !== speechRunId) {
                return;
            }
            // 在点击手势内补播：同样优先媒体元素通道。
            playHtmlAudio(pending.audio, pending.text, pending.runId, pending.action).catch(() => {
                Promise.resolve(context.resume ? context.resume() : null).then(() => {
                    if (pending.runId === speechRunId && context.state === "running") {
                        playWebAudio(pending.audio, pending.text, pending.runId, pending.action).catch(() => {});
                    }
                }).catch(() => {});
            });
        }

        ["pointerdown", "keydown", "touchstart"].forEach(type => {
            window.addEventListener(type, flushPendingSpeech, { capture: true, passive: true });
        });

        function stopSpeech() {
            speechRunId += 1;
            speakingUntil = 0;
            pendingSpeech = null;
            closeMouthNow();
            if (activeSource) {
                activeSource.onended = null;
                try {
                    activeSource.stop();
                } catch {
                    // 已经播完的 source 重复 stop 会抛错，忽略即可。
                }
                activeSource = null;
            }
            if (activeAudio) {
                activeAudio.pause();
                if (activeAudio.src.startsWith("blob:")) {
                    URL.revokeObjectURL(activeAudio.src);
                }
                activeAudio.src = "";
                activeAudio = null;
            }
            if ("speechSynthesis" in window) {
                speechSynthesis.cancel();
            }
            if (!currentAction && speakingAction) {
                playIdle(speakingAction);
            }
        }

        function enterSpeakingState(transitionFrom = null) {
            if (mixer && !currentAction) {
                const clip = clips.get("speaking_loop");
                if (clip) {
                    const previousAction = transitionFrom || (idleAction && idleAction.isRunning() ? idleAction : null);
                    speakingAction = mixer.clipAction(clip);
                    speakingAction.reset().setLoop(THREE.LoopRepeat).play();
                    if (previousAction && previousAction !== speakingAction) {
                        previousAction.crossFadeTo(speakingAction, 0.18, false);
                    }
                }
            }
            setControlsEnabled(true);
            statusText.textContent = "回答中";
        }

        function handleActionFinished(event) {
            const finishedAction = event.action;
            if (event.action === currentAction) {
                currentAction = null;
            }
            if (speakingUntil) {
                enterSpeakingState(finishedAction);
                return;
            }
            playIdle(finishedAction);
            resumeMicIfNeeded();
        }

        function playAction(name, interruptSpeech = true) {
            const clipName = ACTION_CLIPS[name];
            const clip = clips.get(clipName);
            if (!mixer || !clip) {
                return;
            }
            if (interruptSpeech) {
                stopSpeech();
                resetFaceTargets();
            }
            if (currentAction) {
                currentAction.stop();
            }
            if (idleAction) {
                idleAction.stop();
            }
            if (speakingAction) {
                speakingAction.stop();
            }
            speakingAction = null;
            currentAction = mixer.clipAction(clip);
            currentAction.reset();
            currentAction.setLoop(THREE.LoopOnce, 1);
            currentAction.clampWhenFinished = true;
            currentAction.play();
            setControlsEnabled(false);
            statusText.textContent = interruptSpeech ? "动作中" : "回答中";
        }

        function scheduleNextBlink(now = performance.now()) {
            // 随机间隔让眨眼保持自然节奏，不跟动作时间轴锁死。
            nextBlinkAt = now + BLINK_INTERVAL_MIN_MS + Math.random() * BLINK_INTERVAL_RANGE_MS;
        }

        function triggerBlink(manual = false, now = performance.now()) {
            blinkStartAt = now;
            blinkHoldMs = 110;
            blinkManual = manual;
            scheduleNextBlink(now);
            if (manual) {
                statusText.textContent = "眨眼";
            }
        }

        function updateAutoBlink(now) {
            if (!avatar || blinkStartAt) {
                return;
            }
            if (!nextBlinkAt) {
                scheduleNextBlink(now);
                return;
            }
            if (now >= nextBlinkAt) {
                triggerBlink(false, now);
            }
        }

        function updateBlink(now) {
            if (!blinkStartAt) {
                return;
            }
            const elapsed = now - blinkStartAt;
            const openStart = 80 + blinkHoldMs;
            const endAt = openStart + 120;
            if (elapsed < 80) {
                targetBlink(elapsed / 80);
            } else if (elapsed < openStart) {
                targetBlink(1);
            } else if (elapsed < endAt) {
                targetBlink(1 - (elapsed - openStart) / 120);
            } else {
                const wasManual = blinkManual;
                blinkStartAt = 0;
                blinkManual = false;
                targetBlink(0);
                if (wasManual && !speakingUntil && !currentAction) {
                    statusText.textContent = "待机中";
                }
            }
        }

        function pickMouthMorph(char, index) {
            if ("，。！？、,.!?;；：: ".includes(char)) {
                return null;
            }
            if ("aA啊哈呀啦吗吧大他那发好话家".includes(char)) {
                return { name: "Mouth_A", value: 0.46 };
            }
            if ("哦喔我说多过罗口手".includes(char)) {
                return { name: "Mouth_O", value: 0.42 };
            }
            if ("乌无不出如主".includes(char)) {
                return { name: "Mouth_U", value: 0.38 };
            }
            if ("一你希细其七起是智iI".includes(char)) {
                return { name: "Mouth_E", value: 0.34 };
            }
            if ("嗯恩很真承能犇".includes(char)) {
                return { name: "Mouth_Close", value: 0.28 };
            }
            const names = ["Mouth_A", "Mouth_O", "Mouth_E"];
            return { name: names[(char.charCodeAt(0) + index) % names.length], value: 0.38 };
        }

        // 每个音节加入轻收口状态，让口型有张合节奏而不是停在单一形状。
        function buildMouthSequence(text) {
            const sequence = [];
            [...text].forEach((char, index) => {
                const morph = pickMouthMorph(char, index);
                if (!morph) {
                    sequence.push({ duration: 120 });
                    return;
                }
                sequence.push({ ...morph, duration: 170 });
                sequence.push({ name: morph.name, value: morph.value * 0.28, duration: 55 });
            });
            return sequence.length ? sequence : [{ name: "Mouth_A", value: 0.18, duration: 180 }, { duration: 55 }];
        }

        function startMouth(text, duration) {
            speechText = text;
            mouthStepIndex = 0;
            mouthSequence = buildMouthSequence(text);
            speakingUntil = performance.now() + duration;
            nextMouthAt = 0;
            statusText.textContent = "回答中";
            resetMouthTargets();
            enterSpeakingState();
            const step = mouthSequence[0];
            if (step.name && step.value) {
                targetMorph(step.name, step.value);
                mouthStepIndex = 1;
                nextMouthAt = performance.now() + step.duration;
            }
        }

        function finishSpeech(runId) {
            if (runId !== speechRunId) {
                return;
            }
            activeAudio = null;
            speakingUntil = 0;
            mouthSequence = [];
            closeMouthNow();
            micPausedForReply = false;
            if (!currentAction) {
                playIdle(speakingAction);
            } else {
                statusText.textContent = "动作中";
            }
            resumeMicIfNeeded();
        }

        function updateMouth(now) {
            if (!speakingUntil) {
                return;
            }
            if (now >= speakingUntil) {
                finishSpeech(speechRunId);
                return;
            }
            if (now < nextMouthAt) {
                return;
            }
            resetMouthTargets();
            const step = mouthSequence[mouthStepIndex % mouthSequence.length];
            if (step.name && step.value) {
                targetMorph(step.name, step.value);
            }
            mouthStepIndex += 1;
            nextMouthAt = now + step.duration;
        }

        function pushHistory(role, content) {
            chatHistory.push({ role, content });
            // 只保留短上下文，避免实时对话请求持续变慢。
            while (chatHistory.length > 8) {
                chatHistory.shift();
            }
        }

        // 完整对话记录展示（与发给模型的短上下文分离），最近 80 条落地 localStorage。
        // ===== 多会话历史：每个会话含 id / 标题 / 时间 / 消息，落地 localStorage =====
        const SESSIONS_KEY = "chengxi-sessions";
        const ACTIVE_KEY = "chengxi-active-session";
        const LEGACY_LOG_KEY = "chengxi-chat-log";
        const SESSION_MAX = 40;      // 最多保留的会话数
        const MSG_PER_SESSION = 160; // 单会话保留的消息数

        const sessionList = document.getElementById("sessionList");
        let sessions = [];
        let activeSessionId = null;

        function loadSessions() {
            try {
                const s = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]");
                if (Array.isArray(s)) return s.filter(x => x && x.id && Array.isArray(x.messages));
            } catch {}
            return [];
        }

        function persistSessions() {
            try {
                sessions = sessions.slice(0, SESSION_MAX);
                localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
            } catch {}
        }

        function newSessionObj() {
            return {
                id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                title: "新对话",
                messages: [],
                updatedAt: Date.now()
            };
        }

        function getActiveSession() {
            return sessions.find(s => s.id === activeSessionId) || null;
        }

        function deriveTitle(text) {
            const base = String(text || "").replace(/\s+/g, " ").trim();
            return base ? base.slice(0, 20) : "新对话";
        }

        function migrateLegacyLog() {
            if (sessions.length) return;
            let saved = [];
            try { saved = JSON.parse(localStorage.getItem(LEGACY_LOG_KEY) || "[]"); } catch {}
            if (Array.isArray(saved) && saved.length) {
                const s = newSessionObj();
                s.messages = saved.slice(-MSG_PER_SESSION);
                const firstUser = s.messages.find(m => m && m.role === "user");
                s.title = deriveTitle(firstUser ? firstUser.content : s.messages[0] && s.messages[0].content);
                sessions.unshift(s);
                try { localStorage.removeItem(LEGACY_LOG_KEY); } catch {}
            }
        }

        function sessionGroupLabel(ts) {
            const d = new Date(ts || Date.now());
            const now = new Date();
            const dayMs = 86400000;
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            if (ts >= startOfToday) return "今天";
            if (ts >= startOfToday - dayMs) return "昨天";
            if (ts >= startOfToday - 7 * dayMs) return "近 7 天";
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        }

        function renderSessionList() {
            if (!sessionList) return;
            sessionList.innerHTML = "";
            const sorted = [...sessions].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            let lastGroup = null;
            sorted.forEach(s => {
                const group = sessionGroupLabel(s.updatedAt || 0);
                if (group !== lastGroup) {
                    lastGroup = group;
                    const h = document.createElement("div");
                    h.className = "sidebar-group";
                    h.textContent = group;
                    sessionList.appendChild(h);
                }
                const item = document.createElement("button");
                item.type = "button";
                item.className = "session-item" + (s.id === activeSessionId ? " active" : "");
                item.title = s.title || "新对话";
                item.textContent = s.title || "新对话";
                item.addEventListener("click", () => switchSession(s.id));
                const del = document.createElement("span");
                del.className = "session-del";
                del.textContent = "×";
                del.title = "删除对话";
                del.addEventListener("click", evt => { evt.stopPropagation(); deleteSession(s.id); });
                item.appendChild(del);
                sessionList.appendChild(item);
            });
        }

        function renderChatMessage(role, content) {
            markConversationStarted();
            const node = document.createElement("div");
            node.className = "chat-msg " + (role === "user" ? "user" : "assistant");
            node.textContent = content;
            chatLog.appendChild(node);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function appendChat(role, content) {
            const text = String(content || "").trim();
            if (!text) {
                return;
            }
            renderChatMessage(role, text);
            const s = getActiveSession();
            if (s) {
                s.messages.push({ role, content: text });
                if (s.messages.length > MSG_PER_SESSION) s.messages = s.messages.slice(-MSG_PER_SESSION);
                s.updatedAt = Date.now();
                if ((!s.title || s.title === "新对话") && role === "user") {
                    s.title = deriveTitle(text);
                }
                persistSessions();
                renderSessionList();
            }
        }

        // 载入当前会话的消息到聊天区；为空则保持居中欢迎态。
        function restoreActiveSession() {
            chatLog.innerHTML = "";
            const s = getActiveSession();
            if (!s || !s.messages.length) {
                chatPanel.classList.add("chat-empty");
                return;
            }
            s.messages.slice(-MSG_PER_SESSION).forEach(item => {
                if (item && (item.role === "user" || item.role === "assistant") && item.content) {
                    renderChatMessage(item.role, String(item.content));
                }
            });
        }

        function switchSession(id) {
            if (id === activeSessionId) return;
            activeSessionId = id;
            try { localStorage.setItem(ACTIVE_KEY, id); } catch {}
            weeklyWizard = null;
            chatHistory.length = 0;
            restoreActiveSession();
            renderSessionList();
        }

        function startNewSession() {
            const cur = getActiveSession();
            if (!cur || cur.messages.length) {
                const s = newSessionObj();
                sessions.unshift(s);
                activeSessionId = s.id;
            }
            try { localStorage.setItem(ACTIVE_KEY, activeSessionId); } catch {}
            persistSessions();
            weeklyWizard = null;
            chatHistory.length = 0;
            userInput.value = "";
            autoGrowInput();
            userInput.placeholder = "发消息给犇犇，Enter 发送，Shift+Enter 换行";
            restoreActiveSession();
            renderSessionList();
            userInput.focus();
        }

        function deleteSession(id) {
            sessions = sessions.filter(s => s.id !== id);
            persistSessions();
            if (activeSessionId === id) {
                activeSessionId = sessions[0] ? sessions[0].id : null;
                try { localStorage.setItem(ACTIVE_KEY, activeSessionId || ""); } catch {}
                if (!activeSessionId) {
                    startNewSession();
                    return;
                }
                weeklyWizard = null;
                chatHistory.length = 0;
                restoreActiveSession();
            }
            renderSessionList();
        }

        function initSessions() {
            sessions = loadSessions();
            migrateLegacyLog();
            if (!sessions.length) sessions.unshift(newSessionObj());
            let stored = "";
            try { stored = localStorage.getItem(ACTIVE_KEY) || ""; } catch {}
            activeSessionId = sessions.some(s => s.id === stored) ? stored : sessions[0].id;
            try { localStorage.setItem(ACTIVE_KEY, activeSessionId); } catch {}
            persistSessions();
            renderSessionList();
            restoreActiveSession();
        }

        async function requestModelReply(message, options = {}) {
            const response = await fetch(API_BASE + "/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message, history: options.history || chatHistory, file_ids: attachedFiles.map(file => file.id), weekly_stage: options.weeklyStage || "" })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "chat_failed");
            }
            return {
                text: String(data.text || "我听到了。").trim(),
                action: ACTION_CLIPS[data.action] ? data.action : null,
                uiAction: data.ui_action || null
            };
        }

        async function requestSpeechAudio(text) {
            const response = await fetch(API_BASE + "/api/tts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "tts_failed");
            }
            return data.audio;
        }

        function playBrowserSpeech(text, runId, action = null) {
            if (!voiceEnabled || !("speechSynthesis" in window)) {
                startMouth(text, Math.max(4200, text.length * 230));
                if (action) {
                    playAction(action, false);
                }
                return;
            }
            startMouth(text, Number.POSITIVE_INFINITY);
            if (action) {
                playAction(action, false);
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "zh-CN";
            utterance.rate = 1.08;
            utterance.pitch = 1.45;
            utterance.volume = 1;
            // 口型以真实朗读结束为准，避免声音停了嘴还继续动。
            utterance.onend = () => finishSpeech(runId);
            utterance.onerror = event => {
                audioLog("浏览器朗读失败", event?.error || "");
                if (runId === speechRunId) {
                    statusText.textContent = "语音播放失败（浏览器朗读不可用）";
                }
                finishSpeech(runId);
            };
            speechSynthesis.speak(utterance);
        }

        async function playWebAudio(audioUri, text, runId, action) {
            const context = ensureAudioContext();
            if (!context) {
                return false;
            }
            const raw = audioUriToBytes(audioUri).buffer;
            const buffer = await decodeAudio(context, raw);
            if (!buffer) {
                audioLog("WebAudio 解码结果为空");
                return false;
            }
            if (runId !== speechRunId) {
                return true;
            }
            if (context.state !== "running") {
                await context.resume().catch(() => {});
            }
            if (context.state !== "running") {
                audioLog("AudioContext 未解锁", context.state);
                return false;
            }
            const source = context.createBufferSource();
            source.buffer = buffer;
            // TTS 音量普遍偏小，加一级增益（峰值 35% 左右，1.8 倍不会削波）。
            const gain = context.createGain();
            gain.gain.value = 1.8;
            source.connect(gain);
            gain.connect(context.destination);
            source.onended = () => finishSpeech(runId);
            activeSource = source;
            startMouth(text, Number.POSITIVE_INFINITY);
            if (action) {
                playAction(action, false);
            }
            source.start();
            audioLog("WebAudio 播放中", `时长 ${buffer.duration.toFixed(1)}s`);
            return true;
        }

        async function playHtmlAudio(audioUri, text, runId, action) {
            // Blob URL 比超长 data: src 更稳，播完即回收。
            const blob = new Blob([audioUriToBytes(audioUri)], { type: "audio/mpeg" });
            const blobUrl = URL.createObjectURL(blob);
            const release = () => URL.revokeObjectURL(blobUrl);
            activeAudio = new Audio(blobUrl);
            activeAudio.onplay = () => {
                startMouth(text, Number.POSITIVE_INFINITY);
                if (action) {
                    playAction(action, false);
                }
            };
            activeAudio.onended = () => {
                release();
                finishSpeech(runId);
            };
            activeAudio.onerror = event => {
                audioLog("Audio 元素播放出错", event?.message || "");
                release();
                finishSpeech(runId);
            };
            try {
                await activeAudio.play();
                audioLog("Audio 元素播放中");
            } catch (error) {
                release();
                throw error;
            }
        }

        async function speak(text, action = null) {
            stopSpeech();
            const runId = ++speechRunId;
            if (!voiceEnabled) {
                playBrowserSpeech(text, runId, action);
                return;
            }
            try {
                const audio = await requestSpeechAudio(text);
                if (runId !== speechRunId) {
                    return;
                }
                // 优先用媒体元素播放（与视频网站同一条输出通道，规避 Safari 的
                // AudioContext 采样率假播放 bug）；被自动播放策略拦下再走 WebAudio。
                try {
                    await playHtmlAudio(audio, text, runId, action);
                    return;
                } catch (error) {
                    audioLog("Audio 元素播放被拒绝", error?.name || String(error));
                }
                if (runId !== speechRunId) {
                    return;
                }
                let played = false;
                try {
                    played = await playWebAudio(audio, text, runId, action);
                } catch (error) {
                    audioLog("WebAudio 播放失败", error?.name || String(error));
                    played = false;
                }
                if (!played && runId === speechRunId) {
                    // 两条通道都被拦：排队等下一次点击补播，并给出可见提示。
                    pendingSpeech = { audio, text, action, runId };
                    statusText.textContent = "点击页面任意位置播放语音";
                }
            } catch (error) {
                audioLog("语音合成接口失败", error?.message || String(error));
                if (runId === speechRunId) {
                    statusText.textContent = "语音合成失败，改用浏览器朗读";
                    playBrowserSpeech(text, runId, action);
                }
            }
        }

        function speakWithGesture(text, action) {
            appendChat("assistant", text);
            speak(text, action);
        }

        function weeklyDraftReviewText(draft) {
            const sections = [
                ["本周工作总结", draft.weekly_summary || []],
                ["重点工作跟进", draft.weekly_follow || []],
                ["下周工作计划", draft.weekly_next || []],
            ];
            return "周报草稿（请先核对，未确认不会写入编辑页）\n\n" + sections.map(([title, rows]) => {
                const body = rows.length ? rows.map((row, index) => `${index + 1}. ${row.category || "未分类"}：${row.content || ""}${row.status ? `（${row.status}）` : ""}${row.progress ? `；进展：${row.progress}` : ""}${row.plan ? `；计划：${row.plan}` : ""}${row.difficulty ? `；困难：${row.difficulty}` : ""}`).join("\n") : "（暂无内容）";
                return `${title}\n${body}`;
            }).join("\n\n");
        }

        function appendWeeklyDraftReview(draft) {
            pendingWeeklyDraft = draft;
            appendChat("assistant", weeklyDraftReviewText(draft));
            const actions = document.createElement("div");
            actions.className = "weekly-draft-review-actions";
            const revise = document.createElement("button");
            revise.type = "button";
            revise.textContent = "继续修改内容";
            revise.addEventListener("click", () => { userInput.focus(); userInput.placeholder = "说明需要修改的分类、内容或计划后发送"; });
            const confirm = document.createElement("button");
            confirm.type = "button";
            confirm.className = "primary";
            confirm.textContent = "确认写入周报编辑页";
            confirm.addEventListener("click", () => {
                if (!pendingWeeklyDraft || window.parent === window) return;
                window.parent.postMessage({ type: "chengxi.weekly-ready", draft: pendingWeeklyDraft }, "*");
                confirm.disabled = true;
                confirm.textContent = "正在打开编辑页…";
            });
            actions.append(revise, confirm);
            chatLog.appendChild(actions);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // ===== 周报向导：阶段内可多轮讨论，确认后才固化到草稿 =====
        const WEEKLY_STAGES = [
            {
                key: "summary",
                title: "第 1 步 / 共 3 步 · 本周工作总结",
                prompt: "请描述本周完成的主要工作，建议按「分类：具体内容」分条填写。\n例如：\n客流识别：完成 16 个客流实例恢复核验\n平台优化：修复管理器退出异常"
            },
            {
                key: "follow",
                title: "第 2 步 / 共 3 步 · 重点工作跟进",
                prompt: "请说明本周的重点工作及其进展、遇到的困难或需要的支持，可分条填写。\n例如：\n直播联调：抽帧成功率优化，进展持续进行中，困难中等"
            },
            {
                key: "next",
                title: "第 3 步 / 共 3 步 · 下周工作计划",
                prompt: "请描述下周的工作计划，可分条列出重点安排。\n例如：\n性能优化：持续优化多实例并发推理性能"
            }
        ];
        let weeklyWizard = null;

        function previousWeeklyText(previous) {
            const sections = [["本周工作总结", previous.weekly_summary], ["重点工作跟进", previous.weekly_follow], ["下周工作计划", previous.weekly_next]];
            const body = sections.map(([title, text]) => `${title}\n${String(text || "（无记录）").trim() || "（无记录）"}`).join("\n\n");
            return `上周周报参考${previous.source ? `（${previous.source}）` : ""}\n\n${body}`;
        }

        function weeklyStageHistory() {
            return (weeklyWizard?.turns || []).slice(-8).map(turn => ({ role: turn.role, content: turn.content.slice(0, 600) }));
        }

        async function requestWeeklyStageReply(message, stage) {
            const context = weeklyWizard?.data || {};
            const prompt = `当前正在整理“${stage.title}”。用户本轮内容：${message}\n已确认内容参考：${JSON.stringify(context)}\n请与用户继续讨论，并给出一版可直接确认的本阶段草稿。`;
            return requestModelReply(prompt, { history: weeklyStageHistory(), weeklyStage: stage.title });
        }

        function appendWeeklyStageActions() {
            if (!weeklyWizard || weeklyWizard.awaiting !== "chat") return;
            const stageIndex = weeklyWizard.index;
            const stage = WEEKLY_STAGES[weeklyWizard.index];
            const actions = document.createElement("div");
            actions.className = "weekly-draft-review-actions";
            const revise = document.createElement("button");
            revise.type = "button";
            revise.textContent = "继续讨论与修改";
            revise.addEventListener("click", () => userInput.focus());
            const confirm = document.createElement("button");
            confirm.type = "button";
            confirm.className = "primary";
            confirm.textContent = weeklyWizard.index === WEEKLY_STAGES.length - 1 ? "确认本阶段，生成周报草稿" : "确认本阶段，下一步";
            confirm.addEventListener("click", () => {
                if (!weeklyWizard || weeklyWizard.index !== stageIndex || weeklyWizard.awaiting !== "chat" || !weeklyWizard.candidate) return;
                weeklyWizard.data[stage.key] = weeklyWizard.candidate;
                weeklyWizard.index += 1;
                if (weeklyWizard.index >= WEEKLY_STAGES.length) finishWeeklyReport();
                else enterWeeklyStage(weeklyWizard.index);
            });
            actions.append(revise, confirm);
            chatLog.appendChild(actions);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function enterWeeklyStage(index) {
            const stage = WEEKLY_STAGES[index];
            weeklyWizard.awaiting = "chat";
            weeklyWizard.turns = [];
            weeklyWizard.candidate = "";
            if (stage.key === "follow") {
                const previousFollow = String(weeklyWizard.previous.weekly_follow || "").trim();
                weeklyWizard.candidate = previousFollow;
                appendChat("assistant", `${stage.title}\n\n这是上周重点工作，可直接沿用；如需改动，直接说要补充、删减或调整什么，我们会在这一阶段继续讨论。\n\n上周重点工作\n${previousFollow || "（未找到上周重点工作）"}`);
                const actions = document.createElement("div");
                actions.className = "weekly-draft-review-actions";
                const modify = document.createElement("button");
                modify.type = "button";
                modify.textContent = "修改重点工作";
                modify.addEventListener("click", () => { appendChat("assistant", "好的，把需要修改的重点工作发给我；也可以上传材料后让我整理。 "); userInput.focus(); });
                const keep = document.createElement("button");
                keep.type = "button";
                keep.className = "primary";
                keep.textContent = "保持上周重点工作，下一步";
                keep.addEventListener("click", () => {
                    if (!weeklyWizard || weeklyWizard.index !== index) return;
                    weeklyWizard.data.follow = weeklyWizard.candidate;
                    weeklyWizard.index += 1;
                    enterWeeklyStage(weeklyWizard.index);
                });
                actions.append(modify, keep);
                chatLog.appendChild(actions);
            } else {
                appendChat("assistant", `${stage.title}\n\n${stage.prompt}\n\n你可以逐条补充、让我改写，也可以上传文档后说“帮我总结这份材料”。满意后点击“确认本阶段，下一步”。`);
            }
            userInput.placeholder = "输入本阶段内容，Enter 发送，Shift+Enter 换行";
            userInput.focus();
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function startWeeklyReport() {
            weeklyWizard = { index: 0, awaiting: "loading", data: {}, turns: [], candidate: "", previous: {} };
            appendChat("assistant", "好的，我先为你找出上周周报作为参考，然后开始整理本周内容。");
            statusText.textContent = "正在读取上周周报";
            try {
                const response = await fetch(API_BASE + "/api/weekly-prefill");
                const previous = await response.json();
                if (!response.ok) throw new Error(previous.error || "weekly_prefill_failed");
                weeklyWizard.previous = previous || {};
                appendChat("assistant", previousWeeklyText(weeklyWizard.previous));
            } catch {
                weeklyWizard.previous = {};
                appendChat("assistant", "暂未读取到上周周报，我们直接从本周工作总结开始。 ");
            }
            statusText.textContent = "可以开始整理周报";
            if (weeklyWizard) enterWeeklyStage(0);
        }

        // 把一段文本拆成周报行：识别「分类：内容」，并去掉行首序号。
        function weeklyRowsFromText(text) {
            return String(text || "")
                .split(/\n+/)
                .map(line => line.replace(/^\s*[-•]?\s*\d*[.、)\s]*/, "").trim())
                .filter(Boolean)
                .map(line => {
                    const m = line.match(/^([^：:，,。;；]{1,14})[：:](.+)$/);
                    const category = m ? m[1].trim() : "";
                    const content = m ? m[2].trim() : line;
                    return { category, content, status: "", progress: "", plan: "", difficulty: "" };
                });
        }

        function buildWeeklyDraft(data) {
            return {
                weekly_summary: weeklyRowsFromText(data.summary),
                weekly_follow: weeklyRowsFromText(data.follow),
                weekly_next: weeklyRowsFromText(data.next)
            };
        }

        function finishWeeklyReport() {
            const data = weeklyWizard ? weeklyWizard.data : {};
            weeklyWizard = null;
            userInput.placeholder = "发消息给犇犇，Enter 发送，Shift+Enter 换行";
            const draft = buildWeeklyDraft(data);
            pushHistory("user", "（周报向导）已确认本周工作、重点跟进、下周计划三部分内容");
            appendChat("assistant", "三部分内容已确认，我按周报三区格式整理成草稿。请最后核对，确认无误后点击「确认写入周报编辑页」。");
            appendWeeklyDraftReview(draft);
        }

        // 输入内容增多时让输入框自动长高（封顶 150px 后内部滚动）。
        function autoGrowInput() {
            userInput.style.height = "auto";
            userInput.style.height = Math.min(userInput.scrollHeight, 150) + "px";
        }

        // 与后端 _weekly_intent 对齐：识别「写/生成周报」类意图，但排除“查历史/列表”。
        function isWeeklyReportIntent(text) {
            if (/报告列表|历史报告|报告记录|查询.*报告|列出.*报告|最近报告|历史周报|周报历史/.test(text)) return false;
            return /周报|工作总结/.test(text) && /写|生成|整理|输出|编写|开始|做一份|来一份|帮我/.test(text);
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) {
                userInput.focus();
                return;
            }

            // 周报向导进行中：每条消息都进入当前阶段的真实多轮对话，模型的最新草稿可被确认。
            if (weeklyWizard) {
                userInput.value = "";
                autoGrowInput();
                appendChat("user", text);
                if (weeklyWizard.awaiting !== "chat") return;
                weeklyWizard.turns.push({ role: "user", content: text });
                statusText.textContent = "正在整理本阶段内容";
                setControlsEnabled(false);
                try {
                    const stage = WEEKLY_STAGES[weeklyWizard.index];
                    const answer = await requestWeeklyStageReply(text, stage);
                    weeklyWizard.turns.push({ role: "assistant", content: answer.text });
                    weeklyWizard.candidate = answer.text;
                    speakWithGesture(answer.text, answer.action);
                    appendWeeklyStageActions();
                } catch (error) {
                    appendChat("assistant", `本阶段对话未完成：${error?.message || "请稍后重试"}`);
                } finally {
                    setControlsEnabled(true);
                    statusText.textContent = "可继续讨论，或确认本阶段";
                }
                return;
            }

            // 用户直接说「写周报/生成周报」时，进入分三步的引导流程。
            if (isWeeklyReportIntent(text)) {
                userInput.value = "";
                autoGrowInput();
                appendChat("user", text);
                startWeeklyReport();
                return;
            }

            userInput.value = "";
            autoGrowInput();
            appendChat("user", text);
            statusText.textContent = "思考中";
            setControlsEnabled(false);
            try {
                const answer = await requestModelReply(text);
                pushHistory("user", text);
                pushHistory("assistant", answer.text);
                speakWithGesture(answer.text, answer.action);
                if (answer.uiAction && answer.uiAction.type === "weekly_draft_review" && answer.uiAction.draft) {
                    appendWeeklyDraftReview(answer.uiAction.draft);
                }
                attachedFiles = [];
                renderFileChips();
            } catch (error) {
                const detail = error && error.message ? String(error.message) : "对话服务暂时不可用，请稍后再试。";
                appendChat("assistant", `对话未完成：${detail}`);
                statusText.textContent = "对话失败，可重试";
            }
        }

        function renderFileChips() {
            fileChips.innerHTML = attachedFiles.map(file => `<span class="file-chip">${file.name}<button type="button" data-file-id="${file.id}" aria-label="移除文件">×</button></span>`).join("");
            fileChips.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
                attachedFiles = attachedFiles.filter(file => file.id !== button.dataset.fileId);
                renderFileChips();
            }));
        }

        function readUploadFile(file) {
            return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve({ name:file.name, data:String(reader.result || "") }); reader.onerror = () => reject(new Error(file.name + "读取失败")); reader.readAsDataURL(file); });
        }

        fileBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", async () => {
            const files = Array.from(fileInput.files || []); fileInput.value = ""; if (!files.length) return;
            fileBtn.disabled = true; statusText.textContent = "正在识别文件";
            try { const response = await fetch(API_BASE + "/api/writing/upload", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({files:await Promise.all(files.map(readUploadFile))}) }); const data=await response.json(); if (!response.ok) throw new Error(data.error || "upload_failed"); attachedFiles = attachedFiles.concat(data.files || []).slice(-6); renderFileChips(); statusText.textContent = "文件已识别，可提问"; } catch (error) { statusText.textContent = "文件识别失败"; } finally { fileBtn.disabled = false; }
        });

        document.querySelectorAll(".quick-prompt").forEach(button => button.addEventListener("click", () => {
            if (button.dataset.wizard === "weekly") {
                if (weeklyWizard) return; // 向导进行中避免重复开启
                appendChat("user", "写周报");
                startWeeklyReport();
                return;
            }
            userInput.value = button.dataset.prompt || "";
            sendMessage();
        }));

        function setupRecognizer() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                micBtn.disabled = true;
                micBtn.title = "当前浏览器不支持语音输入";
                return;
            }
            recognizer = new SpeechRecognition();
            recognizer.lang = "zh-CN";
            recognizer.continuous = false;
            recognizer.interimResults = false;
            recognizer.onresult = event => {
                if (!micActive) {
                    return;
                }
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (!transcript) {
                    return;
                }
                micPausedForReply = true;
                userInput.value = transcript;
                sendMessage();
            };
            recognizer.onend = () => {
                listening = false;
                resumeMicIfNeeded();
            };
            recognizer.onerror = () => {
                listening = false;
                resumeMicIfNeeded();
            };
        }

        function startMicListening() {
            if (!recognizer || !micActive || micPausedForReply || listening || speakingUntil || currentAction) {
                return;
            }
            try {
                listening = true;
                statusText.textContent = "聆听中";
                recognizer.start();
            } catch {
                listening = false;
            }
        }

        function resumeMicIfNeeded() {
            if (!micActive || micPausedForReply || speakingUntil || currentAction) {
                return;
            }
            window.setTimeout(startMicListening, 180);
        }

        function setMicActive(active) {
            micActive = active;
            micPausedForReply = false;
            micBtn.classList.toggle("active", active);
            micBtn.setAttribute("aria-pressed", active ? "true" : "false");
            micBtn.title = active ? "关闭语音输入" : "语音输入";
            micBtn.setAttribute("aria-label", active ? "关闭语音输入" : "语音输入");
            if (active) {
                startMicListening();
                return;
            }
            if (recognizer && listening) {
                recognizer.abort();
            }
            listening = false;
            if (!speakingUntil && !currentAction) {
                statusText.textContent = "待机中";
            }
        }

        function loadAvatar() {
            if (avatarLoaded) return;
            avatarLoaded = true;
            setControlsEnabled(false);
            new GLTFLoader().load(
                MODEL_URL,
                gltf => {
                    avatar = gltf.scene;
                    avatar.visible = false;
                    mixer = new THREE.AnimationMixer(avatar);
                    gltf.animations.forEach(clip => clips.set(clip.name, clip));
                    mixer.addEventListener("finished", handleActionFinished);
                    collectMorphTargets(avatar);
                    fitAvatar(avatar);
                    resetFaceTargets();
                    scheduleNextBlink();
                    playIdle(null, true);
                    avatar.visible = true;
                    viewer.classList.add("ready");
                    viewerLoading.textContent = "";
                },
                undefined,
                () => {
                    statusText.textContent = "模型加载失败";
                    viewerLoading.textContent = "模型加载失败";
                }
            );
        }

        function setAvatarVisible(visible) {
            document.body.classList.toggle("avatar-hidden", !visible);
            avatarBtn.classList.toggle("active", visible);
            avatarBtn.title = visible ? "隐藏犇犇数字人" : "显示犇犇数字人";
            avatarBtn.setAttribute("aria-label", avatarBtn.title);
            if (visible) loadAvatar();
        }

        window.chengxiAvatar = {
            blink: () => triggerBlink(true),
            talk: (text = DEMO_SPEECH_TEXT, action = null) => speakWithGesture(text, action),
            playAction
        };

        // 主站把数字人嵌在 iframe 里，通过 postMessage 转发首页快捷提问。
        window.addEventListener("message", event => {
            const data = event.data;
            if (!data || data.type !== "chengxi.ask" || typeof data.text !== "string") {
                return;
            }
            const text = data.text.trim();
            if (!text) {
                return;
            }
            // 父页面发来提问时若对话框处于隐藏状态，自动展开以便看到回答。
            if (document.body.classList.contains("chat-hidden")) {
                setChatHidden(false);
            }
            userInput.value = text;
            sendMessage();
        });

        function render() {
            requestAnimationFrame(render);
            const delta = clock.getDelta();
            const now = performance.now();
            resizeRenderer();
            controls.update();
            if (mixer) {
                mixer.update(delta);
            }
            updateAutoBlink(now);
            updateBlink(now);
            updateMouth(now);
            updateMorphs(delta);
            renderer.render(scene, camera);
        }

        actionButtons.forEach(button => {
            button.addEventListener("click", () => {
                const action = button.dataset.action;
                if (action === "blink") {
                    triggerBlink(true);
                    return;
                }
                if (action === "talk") {
                    speakWithGesture(DEMO_SPEECH_TEXT, "greet");
                    return;
                }
                speakWithGesture(ACTION_SPEECH[action], action);
            });
        });

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", event => {
            // Enter 发送，Shift+Enter 换行。
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        userInput.addEventListener("input", autoGrowInput);

        voiceBtn.addEventListener("click", () => {
            voiceEnabled = !voiceEnabled;
            voiceBtn.classList.toggle("active", voiceEnabled);
            voiceBtn.title = voiceEnabled ? "关闭语音朗读" : "开启语音朗读";
            voiceBtn.setAttribute("aria-label", voiceBtn.title);
            if (!voiceEnabled) {
                stopSpeech();
                return;
            }
            // 在点击手势内解锁音频并立即试播，方便确认扬声器链路。
            ensureAudioContext();
            speak("语音已开启。");
        });

        micBtn.addEventListener("click", () => {
            if (!recognizer) {
                return;
            }
            setMicActive(!micActive);
        });

        avatarBtn.addEventListener("click", () => setAvatarVisible(document.body.classList.contains("avatar-hidden")));

        // 历史会话侧栏：新对话 / 收起 / 展开。
        const newChatBtn = document.getElementById("newChatBtn");
        const sidebarCollapseBtn = document.getElementById("sidebarCollapseBtn");
        const sidebarShowBtn = document.getElementById("sidebarShowBtn");
        if (newChatBtn) newChatBtn.addEventListener("click", startNewSession);
        if (sidebarCollapseBtn) sidebarCollapseBtn.addEventListener("click", () => document.body.classList.add("sidebar-collapsed"));
        if (sidebarShowBtn) sidebarShowBtn.addEventListener("click", () => document.body.classList.remove("sidebar-collapsed"));

        initSessions();
        setupRecognizer();
        setAvatarVisible(false);
        setControlsEnabled(true);
        render();
    </script>
</body>
</html>
