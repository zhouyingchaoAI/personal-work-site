<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>承希 3D 数字人</title>
    <link rel="icon" href="data:,">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg: #111316;
            --panel: #f8fafc;
            --text: #111827;
            --muted: #667085;
            --line: #d7dde5;
            --cyan: #14a6c7;
            --cyan-dark: #087b98;
            --shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            color: var(--panel);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.14), transparent 25rem),
                linear-gradient(145deg, #15191e 0%, #0d0f12 54%, #15181c 100%);
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        .app {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 14px;
            width: min(1080px, calc(100vw - 36px));
            height: 100vh;
            margin: 0 auto;
            padding: 24px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 42px;
            color: rgba(255, 255, 255, 0.78);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-weight: 700;
            letter-spacing: 0;
        }

        .brand-logo {
            display: block;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            object-fit: cover;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            min-width: 132px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            background: #24d18d;
            box-shadow: 0 0 0 5px rgba(36, 209, 141, 0.16);
        }

        .viewer {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border-radius: 8px;
            background:
                radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.13), transparent 19rem),
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
        }

        .viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .viewer-loading {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.68);
            font-size: 14px;
            pointer-events: none;
        }

        .viewer.ready .viewer-loading {
            display: none;
        }

        .panel {
            display: grid;
            gap: 12px;
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(248, 250, 252, 0.94);
            box-shadow: var(--shadow);
            color: var(--text);
        }

        .chat-log {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 190px;
            min-height: 0;
            padding: 10px;
            overflow-y: auto;
            border: 1px solid #e1e6ed;
            border-radius: 10px;
            background: #fff;
        }

        .chat-msg {
            max-width: 86%;
            padding: 8px 12px;
            border-radius: 12px;
            color: #243042;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-msg.assistant {
            align-self: flex-start;
            border: 1px solid #e1e6ed;
            border-bottom-left-radius: 4px;
            background: #f4f8fb;
        }

        .chat-msg.user {
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            background: var(--cyan);
            color: #fff;
        }

        .panel-status {
            min-height: 16px;
            color: var(--muted);
            font-size: 12px;
        }

        .action-bar {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 8px;
        }

        .action-btn {
            height: 36px;
            border-radius: 8px;
            background: #edf4f7;
            color: #244151;
            font-size: 14px;
            transition: transform 120ms ease, background 120ms ease, color 120ms ease;
        }

        .action-btn:hover {
            background: #dcecf2;
        }

        .action-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .action-btn:disabled {
            color: #98a2b3;
            background: #eef2f6;
        }

        /* 输入框独占一行（多行可拉伸），按钮排在下一行。 */
        .controls {
            display: grid;
            grid-template-columns: 44px 44px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
        }

        .input {
            grid-column: 1 / -1;
            width: 100%;
            min-width: 0;
            min-height: 64px;
            max-height: 150px;
            padding: 10px 13px;
            font: inherit;
            line-height: 1.5;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #fff;
        }

        .input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(20, 166, 199, 0.15);
        }

        .btn {
            display: inline-grid;
            grid-auto-flow: column;
            place-items: center;
            gap: 7px;
            min-width: 44px;
            height: 44px;
            padding: 0 14px;
            border-radius: 8px;
            background: #e9eef5;
            color: #243042;
            transition: transform 120ms ease, background 120ms ease, color 120ms ease;
        }

        .btn:hover {
            background: #dce5ee;
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn.primary {
            min-width: 84px;
            background: var(--cyan);
            color: #fff;
            font-weight: 700;
        }

        .btn.primary:hover {
            background: var(--cyan-dark);
        }

        .btn.active {
            background: #fff2df;
            color: #9d5a00;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 窄屏/嵌入主站悬浮面板时：舞台改为弹性高度，保证对话框和语音按钮始终可见。 */
        @media (max-width: 720px) {
            body {
                overflow-y: auto;
            }

            .app {
                grid-template-rows: auto minmax(170px, 1fr) auto;
                width: calc(100vw - 24px);
                height: auto;
                min-height: 100vh;
                padding: 12px 0;
                gap: 10px;
            }

            .panel {
                padding: 12px;
            }

            .chat-log {
                height: 150px;
            }

            .action-bar {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
            }

            .action-btn {
                height: 32px;
                font-size: 13px;
            }

            .input {
                min-height: 56px;
            }
        }

        /* 嵌在主站 iframe 里：桌宠形态——整体透明，犇犇直接悬浮在页面上，
           对话区收成一张毛玻璃小卡片。 */
        body.embedded {
            background: none;
        }

        body.embedded .topbar {
            display: none;
        }

        /* 嵌入布局：左侧历史会话栏 · 中间聊天面板 · 右侧犇犇立绘（可选）。 */
        :root { --sidebar-w: 224px; }

        body.embedded .app {
            position: relative;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 300px;
            grid-template-rows: minmax(0, 1fr);
            grid-template-areas: "side chat stage";
            align-items: stretch;
            width: 100%;
            height: 100vh;
            padding: 6px 6px 10px;
            gap: 8px;
        }

        /* 默认专注对话：数字人仅在用户手动开启后显示。 */
        body.embedded.avatar-hidden .app {
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            grid-template-areas: "side chat";
        }
        body.embedded.avatar-hidden .viewer { display: none; }

        /* 收起历史栏后腾出全部宽度给对话。 */
        body.embedded.sidebar-collapsed .app {
            grid-template-columns: minmax(0, 1fr) 300px;
            grid-template-areas: "chat stage";
        }
        body.embedded.sidebar-collapsed.avatar-hidden .app {
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas: "chat";
        }
        body.embedded.sidebar-collapsed .sidebar { display: none; }

        body.embedded .viewer {
            grid-area: stage;
            border-radius: 0;
            background: none;
        }

        body.embedded .panel {
            display: flex;
            flex-direction: column;
            grid-area: chat;
            gap: 8px;
            height: 100%;
            min-height: 0;
        }

        /* ===== 历史会话侧栏 ===== */
        .sidebar { display: none; }

        body.embedded .sidebar {
            grid-area: side;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            height: 100%;
            padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 14px 38px rgba(15, 23, 42, 0.14);
        }

        .sidebar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 2px 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
        }

        .sidebar-brand img {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            object-fit: cover;
        }

        .sidebar-collapse {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #eef2f7;
            color: #55607a;
        }

        .sidebar-collapse:hover { background: #e2e8f2; color: #1f2937; }

        .sidebar-collapse svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .sidebar-new {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid #d3ddf0;
            background: linear-gradient(180deg, #f4f7fd, #eaf0fb);
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            transition: background 120ms ease, border-color 120ms ease;
        }

        .sidebar-new:hover { background: #e5eefc; border-color: #b9cef0; }

        .sidebar-new svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .sidebar-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 2px;
            scrollbar-width: thin;
        }

        .sidebar-group {
            padding: 12px 8px 4px;
            font-size: 11px;
            font-weight: 600;
            color: #9aa4b6;
            letter-spacing: 0.02em;
        }

        .session-item {
            position: relative;
            display: block;
            width: 100%;
            padding: 9px 26px 9px 10px;
            border-radius: 9px;
            background: transparent;
            color: #33405a;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 110ms ease, color 110ms ease;
        }

        .session-item:hover { background: rgba(47, 107, 246, 0.08); }

        .session-item.active {
            background: rgba(47, 107, 246, 0.14);
            color: var(--accent-dark);
            font-weight: 600;
        }

        .session-del {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            display: none;
            width: 18px;
            height: 18px;
            line-height: 16px;
            text-align: center;
            border-radius: 5px;
            color: #97a2b6;
            font-size: 15px;
        }

        .session-item:hover .session-del { display: block; }
        .session-del:hover { background: rgba(220, 38, 38, 0.12); color: #dc2626; }

        /* 收起态下用于重新展开侧栏的浮动按钮。 */
        .sidebar-show {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 6;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.85);
            color: #55607a;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
        }

        body.embedded.sidebar-collapsed .sidebar-show { display: grid; }
        .sidebar-show svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        /* 窄屏（近全屏弹窗）默认隐藏历史栏，把宽度全部让给对话。 */
        @media (max-width: 720px) {
            body.embedded .app,
            body.embedded.avatar-hidden .app {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas: "chat";
            }
            body.embedded .sidebar,
            body.embedded .sidebar-show { display: none !important; }
        }

        body.embedded .chat-log {
            flex: 1;
            height: auto;
            min-height: 120px;
        }

        body.embedded .action-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: thin;
        }

        body.embedded .action-btn {
            flex: 0 0 auto;
            height: 30px;
            padding: 0 11px;
            font-size: 12.5px;
        }

        body.embedded .viewer-loading {
            color: rgba(36, 48, 66, 0.65);
        }

        body.embedded .panel {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 14px 38px rgba(15, 23, 42, 0.22);
        }

        body.embedded .chat-log { min-height: 260px; }
        body.embedded .action-bar { flex-wrap: wrap; overflow: visible; }
        body.embedded .controls { grid-template-columns: 44px 44px 44px 44px minmax(0, 1fr); }
        body.embedded .file-chips { display:flex; flex-wrap:wrap; gap:6px; }
        body.embedded .file-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:7px; background:#eaf5fb; color:#24566b; font-size:12px; }
        body.embedded .file-chip button { background:transparent; color:inherit; font-size:15px; }
        body.embedded .weekly-draft-review-actions { display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 8px; }
        body.embedded .weekly-draft-review-actions button { padding:8px 12px; border:1px solid #bed6e3; border-radius:8px; background:#eef6fa; color:#24566b; font-weight:700; }
        body.embedded .weekly-draft-review-actions button.primary { border-color:var(--accent); background:var(--accent); color:#fff; }

        /* 嵌入模式专属：隐藏/显示对话框的小圆钮，纯人物桌宠形态。 */
        .chat-toggle {
            display: none;
        }

        /* 主站的大窗不再提供旧版“隐藏聊天”圆钮，关闭由主窗口遮罩完成。 */
        body.embedded .chat-toggle { display: none; }

        .chat-toggle svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.embedded.chat-hidden .panel {
            display: none;
        }

        body.embedded.chat-hidden .app {
            grid-template-columns: minmax(0, 1fr);
        }

        body.embedded.chat-hidden .viewer {
            grid-column: 1 / -1;
        }

        body.embedded .chat-log {
            background: rgba(255, 255, 255, 0.66);
        }

        body.embedded .chat-msg.assistant {
            background: rgba(244, 248, 251, 0.92);
        }

        body.embedded .action-btn {
            background: rgba(237, 244, 247, 0.85);
        }

        body.embedded .input,
        body.embedded .btn {
            background: rgba(255, 255, 255, 0.85);
        }

        body.embedded .btn.primary {
            background: var(--cyan);
        }

        body.embedded .btn.active {
            background: #fff2df;
        }

        /* ============ 通用对话式界面（犇犇 Chat）============ */
        :root {
            --accent: #2f6bf6;
            --accent-dark: #1f52d0;
        }

        /* 居中欢迎态：无消息时只显示问候语 + 输入框，像通用大模型对话。 */
        .chat-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 30px 16px 18px;
            text-align: center;
        }

        .chat-hero-logo {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 8px 22px rgba(47, 107, 246, 0.24);
        }

        .chat-hero-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
        }

        .chat-hero-sub {
            max-width: 460px;
            font-size: 13px;
            line-height: 1.65;
            color: var(--muted);
        }

        .panel.chat-empty .chat-log {
            display: none;
        }

        .panel:not(.chat-empty) .chat-hero {
            display: none;
        }

        /* 欢迎态整体垂直居中，输入框紧随问候语。 */
        .panel.chat-empty {
            justify-content: center;
        }

        /* 数字人动作按钮默认收起，仅在手动开启犇犇立绘后出现。 */
        .avatar-actions {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
        }

        body:not(.avatar-hidden) .avatar-actions {
            display: flex;
        }

        /* 输入区：一张圆角大卡片，文本域在上、工具行在下。 */
        .composer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px 11px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 8px 26px rgba(15, 23, 42, 0.07);
            transition: border-color 130ms ease, box-shadow 130ms ease;
        }

        .composer:focus-within {
            border-color: var(--accent);
            box-shadow: 0 8px 28px rgba(47, 107, 246, 0.16);
        }

        .composer .input {
            grid-column: auto;
            min-height: 44px;
            max-height: 200px;
            padding: 4px 6px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            font-size: 15px;
        }

        .composer .input:focus {
            border: 0;
            box-shadow: none;
        }

        .composer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .composer-tasks {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 34px;
            padding: 0 14px;
            border: 1px solid #dbe3ef;
            border-radius: 999px;
            background: #f4f7fd;
            color: #2f5390;
            font-size: 13px;
            font-weight: 600;
            transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
        }

        .chip:hover {
            background: #e8f0fe;
            border-color: #bcd0f5;
        }

        .chip:active {
            transform: translateY(1px);
        }

        .composer-tools {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #f2f5fa;
            color: #47536b;
            font-size: 16px;
            transition: background 120ms ease, color 120ms ease;
        }

        .tool-btn:hover {
            background: #e6ebf3;
            color: #1f2937;
        }

        .tool-btn.active {
            background: #e5efff;
            color: var(--accent);
        }

        .tool-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tool-btn svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .send-fab {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            margin-left: 2px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(47, 107, 246, 0.32);
            transition: background 120ms ease, transform 120ms ease;
        }

        .send-fab:hover {
            background: var(--accent-dark);
        }

        .send-fab:active {
            transform: scale(0.94);
        }

        .send-fab:disabled {
            background: #c3ccdb;
            box-shadow: none;
            cursor: not-allowed;
        }
